# todo this is needs a refactor, very patched together...
- type: entity
  parent: [ BaseStructure, StructureHealthBarrier ]
  id: TemporaryWall
  name: temporary wall
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: CanBuildWindowOnTop
  - type: Anchorable
    flags:
    - Anchorable
  - type: Sprite
    drawdepth: Walls
    sprite: Structures/Walls/grille.rsi
    layers:
    - state: electrified
      sprite: Effects/electricity.rsi
      map: ["enum.ElectrifiedLayers.Sparks"]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: Structures/Walls/grille.rsi
    state: full
  - type: PlacementReplacement
    key: grilles
  - type: IconSmooth
    index: 0
    key: walls
    base: grille
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - None
        layer:
        - WallLayer
  - type: Appearance
  - type: TemporaryWall
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 500000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageModifierSet: TempWallModSet

- type: damageModifierSet
  id: TempWallModSet
  coefficients:
    Blunt: 0
    Slash: 0
    Piercing: 0
    Heat: 0
    Cold: 0
    Shock: 0
    Caustic: 0
    Structural: 0
